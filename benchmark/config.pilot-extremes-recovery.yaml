    - cepalstat
    - sdg
  strata_targets:
    discovery: 10
    exact_indicator: 10
    semantic_disambiguation: 15
    dimensions: 5
    comparison: 5
    temporal: 5
    metadata: 5
    citation: 5
  gold_standard: benchmark/gold_pilot_cepalstat_sdg_60.json
  results_root: benchmark/results/pilot
roles:
  orchestrator: deterministic-python
  discovery: qwen3.5:9b-mlx
  semantic: qwen3.5:9b-mlx
  retrieval: qwen3.5:9b-mlx
  metadata: qwen3.5:9b-mlx
  citation: qwen3.5:9b-mlx
  judge: mistral:latest
  adversarial: llama3.2:latest
